<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>العيادات الخارجية</title><style>
:root{font-family:Arial,Tahoma,sans-serif;color:#17324d;background:#f4f8fa}*{box-sizing:border-box}body{margin:0;background:#f4f8fa}header{background:#087f8c;color:white;padding:18px 14px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:22px}header small{opacity:.85}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#fff;position:sticky;top:75px;z-index:2;box-shadow:0 2px 8px #0001}.nav button{font-size:12px;padding:10px 4px}.wrap{padding:14px;max-width:900px;margin:auto}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #17324d12}h2{margin:0 0 12px;color:#075b68}h3{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.action,button{border:0;border-radius:10px;background:#087f8c;color:#fff;padding:12px;font-size:15px;cursor:pointer}.action{min-height:82px;text-align:right}.action b{display:block;font-size:16px}.secondary{background:#e7f2f3;color:#075b68}.danger{background:#b53d45}.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid #c8d9df;border-radius:9px;font-size:16px;background:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.notice{background:#e8f7f4;border-right:4px solid #087f8c;padding:12px;border-radius:8px;margin:10px 0}.warning{background:#fff4d7;border-right:4px solid #d69020;padding:12px;border-radius:8px}.error{color:#b53d45;font-weight:bold}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #e5eef0;padding:8px;text-align:right;vertical-align:top}.table-wrap{overflow:auto}.big{font-size:42px;font-weight:bold;color:#087f8c;text-align:center}.badge{display:inline-block;border-radius:20px;padding:4px 8px;background:#e8f0f2}.empty{text-align:center;color:#73848b;padding:20px}@media(min-width:700px){.nav{grid-template-columns:repeat(6,1fr)}}
</style></head><body><header><h1>العيادات الخارجية</h1><small>تطبيق داخلي Offline — البيانات محفوظة على هذا الجهاز</small></header><nav class="nav"><button onclick="show('home')">الرئيسية</button><button onclick="show('book')">حجز داخلي</button><button onclick="show('track')">متابعة حجز</button><button onclick="show('waiting')">شاشة الانتظار</button><button onclick="show('bookings')">كشف الحجوزات</button><button onclick="queue()">شاشة الدور</button><button onclick="settingsGate()">الإعدادات</button></nav><main id="app" class="wrap"></main><script>
const KEY='bsch_offline_v1',DEFAULT_PASS='bsch';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{password:DEFAULT_PASS,nextBooking:1,clinics:[{id:1,name:'عيادة الجهاز الهضمي',days:'السبت، الأربعاء',hours:'09:00 - 14:00'},{id:2,name:'عيادة التغذية',days:'الأحد، الثلاثاء، الخميس',hours:'09:00 - 14:00'},{id:3,name:'عيادة الأسنان',days:'يوميًا عدا الجمعة',hours:'09:00 - 14:00'},{id:4,name:'عيادة السمعيات',days:'الأحد، الاثنين، الثلاثاء، الأربعاء، السبت',hours:'08:30 - 13:00'}],bookings:[],queue:[]};function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){return new Date().toISOString().slice(0,10)}function clinicOptions(){return state.clinics.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}function status(s){return {pending:'قيد المراجعة',confirmed:'مؤكد',cancelled:'ملغى',waiting:'في الانتظار',called:'تم النداء',done:'تم الكشف',skipped:'متخطى'}[s]||s}function show(view){let h='';if(view==='home')h=`<section class="card"><h2>الرئيسية</h2><p>نظام الحجز الداخلي يعمل بالكامل بدون إنترنت أو خادم خارجي.</p><div class="grid"><button class="action" onclick="show('book')"><b>حجز موعد داخلي</b><span>للموظف</span></button><button class="action" onclick="show('track')"><b>متابعة حجز</b><span>بالهاتف ورقم الحجز</span></button><button class="action" onclick="show('waiting')"><b>شاشة الانتظار</b><span>الأرقام الحالية والتالية</span></button><button class="action" onclick="show('bookings')"><b>كشف الحجوزات</b><span>بحث وتصفية</span></button></div></section>`;if(view==='book')book();else if(view==='track')track();else if(view==='waiting')waiting();else if(view==='bookings')bookings();else if(view==='settings')settings();if(h)document.querySelector('#app').innerHTML=h}function book(){document.querySelector('#app').innerHTML=`<section class="card"><h2>حجز موعد داخلي للموظف</h2><form onsubmit="createBooking(event)"><div class="row"><div class="field"><label>اسم المريض</label><input name="name" required></div><div class="field"><label>رقم الهاتف</label><input name="phone" required></div></div><div class="row"><div class="field"><label>السن</label><input name="age"></div><div class="field"><label>الرقم القومي إن وجد</label><input name="nid"></div></div><div class="field"><label>العيادة</label><select name="clinic">${clinicOptions()}</select></div><div class="row"><div class="field"><label>التاريخ</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>الخدمة</label><input name="service" value="كشف أول مرة"></div></div><button>حفظ الحجز</button></form><div id="bookMsg"></div></section>`}function createBooking(e){e.preventDefault();let f=new FormData(e.target),c=state.clinics.find(x=>x.id==f.get('clinic')),name=f.get('name').trim(),phone=f.get('phone').trim(),date=f.get('date');let dup=state.bookings.find(b=>b.name===name&&b.phone===phone&&b.clinic==c.id&&b.date===date&&b.status!=='cancelled');if(dup){document.querySelector('#bookMsg').innerHTML=`<div class="warning">يوجد حجز مشابه بالفعل: ${esc(dup.no)}</div>`;return}let b={id:Date.now(),no:'B'+String(state.nextBooking++).padStart(5,'0'),name,phone,age:f.get('age'),nid:f.get('nid'),clinic:c.id,clinicName:c.name,date,service:f.get('service'),status:'confirmed',created:new Date().toLocaleString('ar-EG')};state.bookings.push(b);save();document.querySelector('#bookMsg').innerHTML=`<div class="notice">تم الحفظ — رقم الحجز <strong>${b.no}</strong><br>${esc(b.name)} — ${esc(c.name)} — ${date}<br><button type="button" onclick="printBooking(${b.id})">طباعة</button></div>`;e.target.reset()}function findBooking(){let no=(document.querySelector('#trackNo')?.value||'').trim(),phone=(document.querySelector('#trackPhone')?.value||'').trim();return state.bookings.find(b=>b.no===no&&b.phone===phone)}function track(){document.querySelector('#app').innerHTML=`<section class="card"><h2>متابعة حجز</h2><form onsubmit="trackSubmit(event)"><div class="field"><label>رقم الهاتف</label><input id="trackPhone" required></div><div class="field"><label>رقم الحجز</label><input id="trackNo" required placeholder="B00001"></div><button>بحث</button></form><div id="trackMsg"></div></section>`}function trackSubmit(e){e.preventDefault();let b=findBooking(),m=document.querySelector('#trackMsg');if(!b){m.innerHTML='<p class="error">لم يتم العثور على الحجز.</p>';return}let q=state.queue.find(x=>x.bookingId===b.id);m.innerHTML=`<div class="notice"><h3>${esc(b.name)}</h3>العيادة: ${esc(b.clinicName)}<br>التاريخ: ${b.date}<br>الحالة: <b>${status(b.status)}</b><br>رقم الدور: <b>${q?.no||'لم يصدر بعد'}</b></div>`}function waiting(){let active=state.queue.filter(q=>q.date===today()&&['waiting','called'].includes(q.status));document.querySelector('#app').innerHTML=`<section class="card"><h2>شاشة الانتظار</h2><div class="big">${active.find(q=>q.status==='called')?.no||'—'}</div><p class="empty">الرقم الحالي</p><div class="table-wrap"><table class="table"><tr><th>الرقم</th><th>العيادة</th><th>الحالة</th></tr>${active.map(q=>`<tr><td><b>${q.no}</b></td><td>${esc(q.clinicName)}</td><td>${status(q.status)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا توجد أرقام انتظار اليوم</td></tr>'}</table></div></section>`}function bookings(){document.querySelector('#app').innerHTML=`<section class="card"><h2>كشف الحجوزات والبحث</h2><div class="row"><input id="search" placeholder="اسم أو هاتف أو رقم حجز" oninput="renderBookings()"><input id="day" type="date" value="${today()}" onchange="renderBookings()"></div><div id="bookingRows"></div></section>`;renderBookings()}function renderBookings(){let q=(document.querySelector('#search')?.value||'').toLowerCase(),d=document.querySelector('#day')?.value;let rows=state.bookings.filter(b=>(!d||b.date===d)&&(!q||[b.name,b.phone,b.no,b.clinicName].join(' ').toLowerCase().includes(q)));document.querySelector('#bookingRows').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>رقم</th><th>المريض</th><th>العيادة</th><th>التاريخ</th><th>الحالة</th><th>الدور</th></tr>${rows.map(b=>{let q=state.queue.find(x=>x.bookingId===b.id);return `<tr><td>${b.no}</td><td>${esc(b.name)}<br>${esc(b.phone)}</td><td>${esc(b.clinicName)}</td><td>${b.date}</td><td>${status(b.status)}</td><td>${q?.no||'—'} ${b.status!=='cancelled'?`<button onclick="issueQueue(${b.id})">إصدار دور</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">لا توجد حجوزات</td></tr>'}</table></div>`}function issueQueue(id){let b=state.bookings.find(x=>x.id===id);if(!b||state.queue.find(q=>q.bookingId===id))return;let same=state.queue.filter(q=>q.clinic===b.clinic&&q.date===b.date);state.queue.push({id:Date.now(),bookingId:id,clinic:b.clinic,clinicName:b.clinicName,date:b.date,no:same.length+1,status:'waiting'});save();bookings()}function queue(){let qs=state.queue.filter(q=>q.date===today());document.querySelector('#app').innerHTML=`<section class="card"><h2>شاشة الدور وإدارته</h2>${qs.map(q=>`<div class="notice"><b>رقم ${q.no}</b> — ${esc(q.clinicName)} — ${status(q.status)}<div class="row"><button onclick="queueAction(${q.id},'called')">نداء</button><button onclick="queueAction(${q.id},'done')">التالي / تم الكشف</button><button class="secondary" onclick="queueAction(${q.id},'skipped')">تخطي</button><button class="secondary" onclick="queueAction(${q.id},'waiting')">رجوع</button></div></div>`).join('')||'<p class="empty">لا توجد أرقام اليوم</p>'}</section>`}function queueAction(id,s){let q=state.queue.find(x=>x.id===id);if(q){q.status=s;save();queue()}}function settingsGate(){let p=prompt('أدخل كلمة مرور الإعدادات','');if(p===state.password)settings();else if(p!==null)alert('كلمة المرور غير صحيحة')}function settings(){document.querySelector('#app').innerHTML=`<section class="card"><h2>الإعدادات</h2><p>هذه النسخة Offline بالكامل. لا يوجد اتصال إنترنت أو خادم خارجي.</p><h3>النسخ الاحتياطي</h3><div class="row"><button onclick="backup()">تصدير نسخة احتياطية</button><button class="secondary" onclick="restore()">استيراد نسخة احتياطية</button></div><h3>تغيير كلمة المرور</h3><form onsubmit="changePassword(event)"><input name="old" type="password" placeholder="كلمة المرور الحالية" required><input name="new" type="password" placeholder="كلمة المرور الجديدة" required><br><button>حفظ كلمة المرور</button></form><h3>العيادات</h3>${state.clinics.map(c=>`<div class="notice"><b>${esc(c.name)}</b><br>${esc(c.days)} — ${esc(c.hours)}</div>`).join('')}<h3>أدوات الدور</h3><button onclick="queue()">فتح شاشة الدور</button></section>`}function changePassword(e){e.preventDefault();let f=new FormData(e.target);if(f.get('old')!==state.password){alert('كلمة المرور الحالية غير صحيحة');return}state.password=f.get('new');save();alert('تم تغيير كلمة المرور');e.target.reset()}function printBooking(id){let b=state.bookings.find(x=>x.id===id);let w=window.open('','_blank');w.document.write(`<html dir="rtl"><body><h2>العيادات الخارجية</h2><h3>تأكيد الحجز ${b.no}</h3><p>المريض: ${esc(b.name)}<br>الهاتف: ${esc(b.phone)}<br>العيادة: ${esc(b.clinicName)}<br>التاريخ: ${b.date}<br>الخدمة: ${esc(b.service)}</p></body></html>`);w.document.close();setTimeout(()=>w.print(),100)}function backup(){let data=JSON.stringify({version:1,exported:new Date().toISOString(),state});if(window.AndroidBridge)AndroidBridge.saveBackup(data);else alert('النسخ الاحتياطي متاح من Android')}function restore(){if(window.AndroidBridge)AndroidBridge.pickBackup();else alert('الاستيراد متاح من Android')}window.importBackup=function(text){try{let x=JSON.parse(text);if(!x.state||!x.state.bookings)throw Error();state=x.state;save();alert('تمت استعادة النسخة الاحتياطية');show('home')}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};show('home');</script></body></html>
